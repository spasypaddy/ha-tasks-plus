name: Android app

on:
  push:
    branches: [main]
    paths: ["android/**", "custom_components/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Version
        # One version number for everything: the integration's manifest
        run: |
          echo "VERSION_NAME=$(jq -r .version ../custom_components/tasks_plus/manifest.json)" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk tasks-plus.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tasks-plus-apk
          path: android/tasks-plus.apk

      - name: Release
        # Creates release v<version> the first time; later builds of the same
        # version replace the app file in it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" tasks-plus.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" tasks-plus.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" \
              --notes "**Home Assistant integration:** update Tasks Plus in HACS, then restart Home Assistant.

          **Android widget:** on your phone, download tasks-plus.apk below and open it to install or update."
          fi
